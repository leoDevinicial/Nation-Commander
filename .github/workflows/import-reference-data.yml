name: Importar dados de referência

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Fonte a importar'
        type: choice
        options: [todas, banco-mundial, fmi]
        default: todas

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Importar Banco Mundial
        if: inputs.source == 'todas' || inputs.source == 'banco-mundial'
        run: npm run data:import:wb
      - name: Importar FMI
        if: inputs.source == 'todas' || inputs.source == 'fmi'
        run: npm run data:import:imf
      - name: Commit dos dados atualizados
        run: |
          if git diff --quiet; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/data/reference/
          git commit -m "Atualiza dados de referência (${{ inputs.source }})"
          git push
